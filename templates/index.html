<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Navarasam</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
  <style>
    @font-face {
      font-family: 'IOSEmoji';
      src: url("{{ url_for('static', filename='ios_emoji.ttf') }}") format('truetype');
      font-display: swap;
    }

    @layer base {

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    }

    /* Custom scrollbar matching macOS */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .apple-sidebar-translucent {
      background-color: #ECEBED;
    }

    .apple-chat-bg {
      background-color: #FFFFFF;
    }

    .bubble-incoming {
      background-color: #E9E9EB;
      color: #000000;
      border-radius: 18px;
      font-family: 'IOSEmoji', -apple-system, BlinkMacSystemFont, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    }

    .bubble-outgoing {
      background: #007AFF;
      color: #FFFFFF;
      border-radius: 18px;
      font-family: 'IOSEmoji', -apple-system, BlinkMacSystemFont, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    }

    .imessage-input-field {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>

<body class="bg-[#E5E5E7] flex items-center justify-center p-0 md:p-6 w-screen h-screen"
  data-initial-room="{{ initial_room_id }}" data-network-ip="{{ network_ip }}">

  <!-- MacBook Native App Window Frame -->
  <div
    class="w-full h-full md:h-[94vh] md:max-w-[1240px] bg-white rounded-none md:rounded-xl shadow-2xl flex flex-col overflow-hidden border border-black/15">
    <!-- Unified macOS Desktop Container -->
    <div class="flex-1 flex flex-row h-full overflow-hidden">

      <!-- ================= CHAT CANVAS ================= -->
      <main class="flex-1 flex flex-col apple-chat-bg h-full overflow-hidden relative">

        <!-- Native Conversation Header Bar with Centered iMessage & Right Share Button -->
        <header
          class="px-5 border-b border-black/[0.08] bg-[#FBFBFB]/90 backdrop-blur-md flex items-center select-none shrink-0 z-20 relative justify-between h-[52px]">

          <!-- Left Back to SaaS Home Link -->
          <div class="w-24 flex items-center">
            <a href="/" class="text-[12px] font-medium text-[#8E8E93] hover:text-[#007AFF] transition-colors flex items-center gap-0.5 cursor-pointer" title="Return to Navarasam SaaS Home">
              <span class="material-symbols-outlined text-[14px]">arrow_back_ios</span>
              <span>Home</span>
            </a>
          </div>

          <!-- Center Title -->
          <div class="flex flex-col items-center justify-center">
            <span class="text-[13px] font-semibold text-[#8E8E93]" id="header-status">Navarasam</span>
          </div>

          <!-- Right Native Share Button -->
          <div class="w-24 flex justify-end">
            <button
              class="px-3 py-1 text-[12px] font-semibold text-[#007AFF] bg-[#007AFF]/10 hover:bg-[#007AFF]/20 active:scale-95 rounded-full transition-all flex items-center gap-1 shadow-xs cursor-pointer"
              id="btn-share-invite" title="Share this chat with a friend" type="button">
              <span class="material-symbols-outlined text-[15px]">ios_share</span>
              <span id="share-label">Share</span>
            </button>
          </div>

        </header>

        <!-- Floating Copy Toast -->
        <div
          class="absolute top-16 left-1/2 -translate-x-1/2 bg-[#1D1D1F]/90 text-white text-[12px] font-medium px-4 py-1.5 rounded-full shadow-lg z-30 transition-all duration-300 opacity-0 pointer-events-none backdrop-blur-md flex items-center gap-1.5"
          id="copy-toast">
          <span class="material-symbols-outlined text-[14px] text-[#34C759]">check_circle</span>
          <span>Link copied! Send it to your friend</span>
        </div>

        <!-- Chat Transcript Message Feed (Clean, No Pre-populated Sample Chats) -->
        <div class="flex-1 overflow-y-auto p-5 space-y-3.5 bg-white" id="messages-container">
          <div class="flex justify-center my-3 select-none">
            <span class="text-[11px] font-medium text-[#8E8E93]">Today</span>
          </div>
        </div>

        <!-- ================= DOCKED MACOS INPUT BAR ================= -->
        <div class="p-3 border-t border-black/[0.08] bg-white shrink-0">
          <form class="relative flex items-center" id="composer-form">
            <!-- Clean Central Text Input Field (No Icons) -->
            <div class="relative flex-1 flex items-center rounded-full bg-[#F5F5F7] imessage-input-field px-4 py-2">
              <input autocomplete="off"
                class="flex-1 bg-transparent border-none outline-none text-[14px] text-[#1D1D1F] placeholder-[#8E8E93] px-1 py-0.5 focus:ring-0"
                id="message-input" placeholder="Navarasam (type in English)..." type="text">
            </div>
            <!-- Native Circular Blue Send Arrow Button -->
            <button
              class="w-9 h-9 rounded-full bg-[#007AFF] text-white flex items-center justify-center ml-2.5 shrink-0 hover:bg-[#0069D9] active:scale-95 transition-all shadow-xs cursor-pointer"
              id="send-btn" title="Send" type="submit">
              <span class="material-symbols-outlined text-[19px]">arrow_upward</span>
            </button>
          </form>
        </div>

      </main>
    </div>
  </div>

  <!-- Interactive Emojify Translation & WebSocket Engine -->
  <script>
    (function () {
      const form = document.getElementById('composer-form');
      const input = document.getElementById('message-input');
      const container = document.getElementById('messages-container');
      const sendBtn = document.getElementById('send-btn');
      const shareBtn = document.getElementById('btn-share-invite');
      const shareLabel = document.getElementById('share-label');
      const plusBtn = document.getElementById('plus-room-btn');
      const headerStatus = document.getElementById('header-status');
      const copyToast = document.getElementById('copy-toast');

      let socket = null;
      let currentRoomId = document.body.dataset.initialRoom || "";

      function showToast(msg) {
        if (!copyToast) return;
        if (msg) copyToast.querySelector('span:last-child').textContent = msg;
        copyToast.classList.remove('opacity-0', 'pointer-events-none');
        copyToast.classList.add('opacity-100');
        setTimeout(() => {
          copyToast.classList.remove('opacity-100');
          copyToast.classList.add('opacity-0', 'pointer-events-none');
        }, 2500);
      }

      function appendOutgoing(emojis) {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col items-end gap-1 ml-auto max-w-[72%]';
        wrapper.innerHTML = `
        <div class="bubble-outgoing px-4 py-2.5 text-[28px] leading-tight select-none">
          ${emojis}
        </div>
        <span class="text-[10px] font-normal text-[#8E8E93] mr-1 select-none">Delivered</span>
      `;
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;
      }

      function appendIncoming(emojis) {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-end gap-2 max-w-[72%] group';
        wrapper.innerHTML = `
        <div class="bubble-incoming px-4 py-2.5 text-[28px] leading-tight select-none">
          ${emojis}
        </div>
      `;
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;
      }

      function initSocket() {
        if (typeof io === 'undefined') return;
        try {
          socket = io({
            transports: ['websocket', 'polling'],
            upgrade: true,
            autoConnect: true
          });

          socket.on('connect', () => {
            if (currentRoomId) {
              joinRoom(currentRoomId);
            } else {
              fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
                .then(r => r.json())
                .then(data => {
                  if (data && data.room_id) {
                    joinRoom(data.room_id);
                  }
                })
                .catch(err => console.error('Room init error:', err));
            }
          });

          socket.on('room_joined', (data) => {
            currentRoomId = data.room_id;
            headerStatus.textContent = `Navarasam • ${data.participant_count}/2 Online`;

            if (data.messages && data.messages.length > 0) {
              data.messages.forEach(msg => {
                if (msg.sender_sid === socket.id) {
                  appendOutgoing(msg.emojis);
                } else {
                  appendIncoming(msg.emojis);
                }
              });
            }
          });

          socket.on('peer_joined', (data) => {
            headerStatus.textContent = `Navarasam • ${data.participant_count}/2 Online`;
            showToast("Friend joined the chat!");
          });

          socket.on('peer_left', (data) => {
            headerStatus.textContent = `Navarasam • ${data.participant_count}/2 Online`;
          });

          socket.on('message_sent', (data) => {
            appendOutgoing(data.emojis);
            sendBtn.disabled = false;
            input.value = '';
            input.focus();
          });

          socket.on('message_received', (data) => {
            appendIncoming(data.emojis);
          });

          socket.on('error', (err) => {
            sendBtn.disabled = false;
            showToast(err && err.message ? err.message : "Error sending message");
          });
        } catch (err) {
          console.warn('Socket error:', err);
        }
      }

      function joinRoom(roomId) {
        currentRoomId = roomId;
        if (!socket) initSocket();
        if (socket && socket.connected) {
          socket.emit('join_room', { room_id: roomId });
        }
        window.history.pushState({}, '', `/room/${roomId}`);
      }

      async function handleShare() {
        if (!currentRoomId) {
          try {
            const res = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            if (data.room_id) {
              joinRoom(data.room_id);
            }
          } catch (e) { }
        }

        let roomUrl;
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          const networkIp = document.body.dataset.networkIp || window.location.hostname;
          const port = window.location.port ? `:${window.location.port}` : '';
          roomUrl = currentRoomId
            ? `http://${networkIp}${port}/room/${currentRoomId}`
            : `http://${networkIp}${port}`;
        } else {
          // Cloud production domain (e.g. https://navarasam.onrender.com)
          roomUrl = currentRoomId
            ? `${window.location.origin}/room/${currentRoomId}`
            : window.location.origin;
        }

        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Navarasam Emojify',
              text: 'Chat with me in emojis!',
              url: roomUrl
            });
            return;
          } catch (err) { }
        }

        try {
          await navigator.clipboard.writeText(roomUrl);
          shareLabel.textContent = "✓ Copied";
          showToast(`Copied: ${roomUrl}`);
          setTimeout(() => { shareLabel.textContent = "Share"; }, 2500);
        } catch {
          prompt("Copy Chat Link:", roomUrl);
        }
      }

      if (shareBtn) shareBtn.addEventListener('click', handleShare);
      if (plusBtn) plusBtn.addEventListener('click', handleShare);

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;

        if (!currentRoomId) {
          fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
            .then(r => r.json())
            .then(data => {
              if (data.room_id) {
                joinRoom(data.room_id);
                setTimeout(() => {
                  if (socket) socket.emit('send_message', { room_id: data.room_id, text: val });
                }, 300);
              }
            })
            .catch(() => {
              fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: val })
              })
                .then(r => r.json())
                .then(d => {
                  appendOutgoing(d.emojis);
                  input.value = '';
                });
            });
          return;
        }

        sendBtn.disabled = true;
        if (socket) {
          socket.emit('send_message', { room_id: currentRoomId, text: val });
        } else {
          fetch('/api/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: val })
          })
            .then(r => r.json())
            .then(data => {
              appendOutgoing(data.emojis);
              sendBtn.disabled = false;
              input.value = '';
            })
            .catch(() => {
              sendBtn.disabled = false;
            });
        }
      });

      initSocket();
    })();
  </script>

</body>

</html>
