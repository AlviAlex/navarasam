        user-select: none;

    }
    /* Custom scrollbar matching macOS */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .apple-sidebar-translucent {
      background-color: #ECEBED;
    }
    .apple-chat-bg {
      background-color: #FFFFFF;
    }
    .bubble-incoming {
      background-color: #E9E9EB;
      color: #000000;
      border-radius: 18px;
    }
    .bubble-outgoing {
      background: #007AFF;
      color: #FFFFFF;
      border-radius: 18px;
    }
    .imessage-input-field {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>

<!-- ================= DOCKED MACOS INPUT BAR ================= -->
<div class="p-3 border-t border-black/[0.08] bg-white shrink-0">
<form class="relative flex items-center" id="composer-form" onsubmit="return false;">
<!-- Left App / Plus Button Inside Field or Adjacent -->
<div class="relative flex-1 flex items-center rounded-full bg-[#F5F5F7] imessage-input-field px-2.5 py-1.5">
<!-- Apps / Attachment '+' Button -->
<button class="w-7 h-7 rounded-full flex items-center justify-center text-[#8E8E93] hover:text-[#1D1D1F] hover:bg-black/5 transition-all shrink-0 mr-1" title="iMessage Apps" type="button">
<span class="material-symbols-outlined text-[19px]">add</span>
</button>
<!-- Central Text Input -->
<input autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-[14px] text-[#1D1D1F] placeholder-[#8E8E93] px-1 py-0.5 focus:ring-0" id="message-input" placeholder="💬 ✨ 🚀 ..." type="text">
<!-- Audio waveform memo icon -->
<button class="w-7 h-7 rounded-full flex items-center justify-center text-[#8E8E93] hover:text-[#1D1D1F] transition-colors shrink-0 mr-0.5" title="Audio Message" type="button">
<span class="material-symbols-outlined text-[18px]">graphic_eq</span>
</button>
<!-- Emoji / Stickers button -->
<button class="w-7 h-7 rounded-full flex items-center justify-center text-[#8E8E93] hover:text-[#1D1D1F] transition-colors shrink-0" title="Emoji and Memoji" type="button">
<span class="material-symbols-outlined text-[19px]">sentiment_satisfied</span>
</button>
</div>
<!-- Native Circular Blue Send Arrow Button -->
<button class="w-8 h-8 rounded-full bg-[#007AFF] text-white flex items-center justify-center ml-2 shrink-0 hover:bg-[#0069D9] active:scale-95 transition-all shadow-xs" id="send-btn" title="Send" type="submit">
<span class="material-symbols-outlined text-[18px]">arrow_upward</span>
</button>
</form>
</div>
</main>
</div>
</div>
<!-- Interactive JavaScript for sending messages authentically -->
<script>
    (function() {
      const form = document.getElementById('composer-form');
      const input = document.getElementById('message-input');
      const container = document.getElementById('messages-container');

      if (!form || !input || !container) return;

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;

        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col items-end gap-1 ml-auto max-w-[72%]';
        
        const cleanVal = val.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        wrapper.innerHTML = `
          <div class="bubble-outgoing px-3.5 py-2 text-[14px] leading-snug">
            ${cleanVal}
          </div>
          <span class="text-[10px] font-normal text-[#8E8E93] mr-1 select-none">Delivered</span>
        `;

        container.appendChild(wrapper);
        input.value = '';
        container.scrollTop = container.scrollHeight;
      });
    })();
  </script>


</body></html>
